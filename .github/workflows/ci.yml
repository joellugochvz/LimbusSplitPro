name: Limbus Split Pro Windows Build & Packaging CI

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build & Package Windows Native App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore NuGet Packages
        run: dotnet restore LimbusSplitPro.sln

      - name: Build Core Library
        run: dotnet build src\LimbusSplitPro.Core\LimbusSplitPro.Core.csproj -c Release --no-restore

      - name: Build Tests
        run: dotnet build src\LimbusSplitPro.Tests\LimbusSplitPro.Tests.csproj -c Release --no-restore

      - name: Build WPF App
        run: dotnet build src\LimbusSplitPro.App\LimbusSplitPro.App.csproj -c Release -r win-x64 --no-restore

      - name: Run Unit Tests
        run: dotnet test src\LimbusSplitPro.Tests\LimbusSplitPro.Tests.csproj -c Release --no-build

      - name: Publish Self-Contained App
        run: dotnet publish src\LimbusSplitPro.App\LimbusSplitPro.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false -o publish_output

      - name: Run Python Engine Tests
        run: python src/LimbusEngine/tests/test_engine.py

      - name: Verify Published Executable
        shell: pwsh
        run: |
          if (Test-Path "publish_output\LimbusSplitPro.exe") {
            Write-Host "LimbusSplitPro.exe verificado correctamente" -ForegroundColor Green
            Get-Item "publish_output\LimbusSplitPro.exe" | Select-Object Name, Length
          } else {
            Write-Host "Archivos en publish_output:" -ForegroundColor Yellow
            Get-ChildItem publish_output -Recurse | Select-Object FullName
            throw "LimbusSplitPro.exe no fue generado!"
          }

      - name: Upload Portable App (Ready to Run)
        uses: actions/upload-artifact@v4
        with:
          name: LimbusSplitPro_Portable_Win64
          path: publish_output/
          retention-days: 90

      - name: Generate SBOM
        run: python scripts/generate_sbom.py

      - name: Try Build Installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup encontrado, generando instalador..." -ForegroundColor Green
            & $iscc installer\setup.iss
          } else {
            Write-Host "Inno Setup no disponible, se omite el instalador." -ForegroundColor Yellow
          }

      - name: Upload Installer (if generated)
        if: success()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: LimbusSplitPro_Installer_Setup
          path: dist/*.exe
          retention-days: 90

      - name: Upload SBOM & Legal
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Legal_Compliance_And_SBOM
          path: |
            dist/SBOM.cdx.json
            legal/THIRD_PARTY_NOTICES.txt
            legal/LGPL_COMPLIANCE.md
            legal/PROVENANCE.json
